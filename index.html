<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0e0a">
<title>Dussehra — The Eternal Ramayana</title>
<style>
:root{--gold:#f3cb78;--paper:#f8e9c7;--muted:#d7bd8d;--wine:#742b1c;--night:#160c09;--panel:rgba(37,19,12,.94);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--paper);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
button{font:inherit}
.shell{min-height:100svh;display:flex;flex-direction:column;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 5%,#6d321b 0,#2a170f 38%,#160c09 80%)}
.shell:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.2;background-image:radial-gradient(#f6d17b 1px,transparent 1.5px),radial-gradient(#f6d17b 1px,transparent 1.5px);background-size:61px 71px,97px 113px;background-position:0 0,31px 41px}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(10px,2vw,22px) clamp(14px,3vw,38px);border-bottom:1px solid #c28c4c45}
.brand{font-size:clamp(.72rem,1.3vw,.95rem);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.music-toggle{border:1px solid #d4aa5d;background:#27160f;color:var(--paper);border-radius:99px;padding:10px 15px;cursor:pointer;font-size:clamp(.75rem,1.2vw,.9rem)}
.music-toggle:hover,.navbtn:hover{background:#63301d}
main{flex:1;display:flex;flex-direction:column;width:min(1440px,100%);margin:0 auto;padding:clamp(12px,2.4vh,26px) clamp(12px,3vw,40px) calc(14px + var(--safe-bottom));gap:clamp(10px,1.8vh,20px)}
.story-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker{font: .72rem Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:var(--gold)}
.counter{font: .78rem Arial,sans-serif;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.progress{height:3px;background:#573723;border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;width:10%;background:linear-gradient(90deg,#9e4228,#f3cb78);transition:width .4s}
.stage{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr);gap:clamp(14px,2.5vw,34px);align-items:stretch;flex:1;min-height:0}
.art-panel{min-height:clamp(235px,45vh,570px);position:relative;overflow:hidden;border:1px solid #d2a35b88;border-radius:5px;background:linear-gradient(#291d2c,#71381e 68%,#25130c);box-shadow:0 16px 55px #0007;isolation:isolate}
.art-panel:before{content:"";position:absolute;width:60%;aspect-ratio:1;border:1px solid #f3cb7840;border-radius:50%;left:20%;top:4%;box-shadow:0 0 0 15px #f3cb7808,0 0 0 32px #f3cb7806;animation:halo 14s linear infinite}
.art-panel:after{content:"";position:absolute;left:-10%;right:-10%;height:35%;bottom:-9%;border-radius:50% 50% 0 0;background:linear-gradient(#512b1d,#160c09);z-index:0}
.moon{position:absolute;top:12%;right:14%;width:clamp(34px,5vw,68px);aspect-ratio:1;border-radius:50%;background:#f5dba0;box-shadow:0 0 28px #f5dba080;animation:moonGlow 4s ease-in-out infinite}
.stars{position:absolute;inset:0;pointer-events:none;color:#ffe7a5}
.star{position:absolute;animation:twinkle 2.7s ease-in-out infinite}
.star:nth-child(1){left:13%;top:18%}.star:nth-child(2){left:76%;top:27%;animation-delay:.7s}.star:nth-child(3){left:28%;top:37%;animation-delay:1.2s}.star:nth-child(4){left:87%;top:47%;animation-delay:.3s}
.scene-label{position:absolute;z-index:5;bottom:14px;left:15px;right:15px;text-align:center;color:#f6d58f;font: .68rem Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 2px 8px #000}
.cast{position:absolute;z-index:2;left:5%;right:5%;bottom:18%;height:62%;display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,2vw,24px)}
.character{font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(3.2rem,9vw,8rem);line-height:1;filter:drop-shadow(0 8px 5px #0006);transform-origin:50% 100%;animation:characterFloat 3.4s ease-in-out infinite}
.character:nth-child(2){animation-delay:-1.3s}.character:nth-child(3){animation-delay:-2.1s}
.character.small{font-size:clamp(2rem,5vw,4.4rem)}
.prop{position:absolute;z-index:3;font-size:clamp(2rem,5vw,4rem);animation:propFloat 5s ease-in-out infinite}
.prop.one{left:8%;top:44%}.prop.two{right:9%;top:52%;animation-delay:-2s}
.scene-card{border:1px solid #bb884b;background:linear-gradient(150deg,rgba(61,32,19,.96),rgba(24,13,9,.98));padding:clamp(19px,3vw,38px);display:flex;flex-direction:column;justify-content:center;position:relative;min-height:0;box-shadow:0 16px 55px #0006}
.scene-card:before{content:"";position:absolute;inset:7px;border:1px solid #d6a85a30;pointer-events:none}
.scene-card>*{position:relative}
.part-label{color:var(--gold);font: .68rem Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase}
h1{font-size:clamp(1.75rem,3.2vw,3.45rem);font-weight:normal;line-height:1.08;color:#f4d28a;margin:12px 0 18px}
.story-copy{font-size:clamp(.98rem,1.32vw,1.2rem);line-height:1.75;color:#f5e8ce;min-height:6.8em}
.story-copy .typed{white-space:pre-wrap}
.cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:3px;vertical-align:-.12em;animation:blink .8s step-end infinite}
.lesson{margin-top:clamp(12px,2vh,24px);padding:15px 17px;border-left:3px solid var(--gold);background:#120a0780}
.lesson-title{font: .66rem Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.lesson p{font-size:clamp(.9rem,1.15vw,1.04rem);line-height:1.6;margin:0;color:#f4dfb7}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
.navbtn{border:1px solid #c59a58;color:var(--paper);background:#2a170f;padding:12px clamp(13px,2vw,24px);cursor:pointer;border-radius:3px;min-width:110px}
.navbtn.primary{background:#7e3320;border-color:#e0b76a}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border:1px solid #d4ae6c;border-radius:50%;padding:0;background:transparent;cursor:pointer}
.dot.active{background:var(--gold);box-shadow:0 0 10px #f3cb7870}
.music-drawer{display:none}
.music-drawer iframe{position:fixed;left:-220px;top:0;width:200px;height:200px;border:0;opacity:0;pointer-events:none}
footer{text-align:center;padding:0 14px 12px;color:#a58a65;font-size:.72rem;letter-spacing:.05em}
@keyframes characterFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes propFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.25)}}
@keyframes halo{to{transform:rotate(360deg)}}
@keyframes moonGlow{0%,100%{box-shadow:0 0 20px #f5dba055}50%{box-shadow:0 0 42px #f5dba0b0}}
@keyframes blink{50%{opacity:0}}
.scene-card.reveal{animation:cardIn .45s ease both}
.art-panel.reveal{animation:artIn .65s ease both}
@keyframes cardIn{from{opacity:.2;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes artIn{from{opacity:.5;filter:saturate(.6)}to{opacity:1;filter:saturate(1)}}
@media(min-aspect-ratio:16/9) and (min-width:1000px){main{padding-top:12px;padding-bottom:12px;gap:10px}.art-panel{min-height:0}.stage{min-height:0}.story-card{padding-top:20px;padding-bottom:20px}.story-copy{line-height:1.58}}
@media(max-width:760px){.stage{grid-template-columns:1fr;grid-template-rows:minmax(215px,34svh) auto}.art-panel{min-height:0}.cast{bottom:17%;height:65%}.character{font-size:clamp(3.3rem,16vw,6rem)}.character.small{font-size:clamp(2rem,10vw,3.7rem)}.scene-card{padding:22px 22px 20px}.story-copy{min-height:0}.controls{padding-top:2px}.navbtn{min-width:0;padding:11px 15px}.masthead{padding-top:10px;padding-bottom:10px}}
@media(max-width:420px){.brand{letter-spacing:.12em;font-size:.67rem}.music-toggle{padding:8px 10px}.stage{grid-template-rows:minmax(205px,31svh) auto}.scene-card{padding:20px 18px}.story-copy{font-size:.97rem;line-height:1.65}.lesson{padding:12px 13px}.controls{gap:7px}.navbtn{font-size:.85rem;padding:10px 12px}.dots{gap:5px}}
@media(max-height:680px) and (min-width:761px){main{padding-top:9px;padding-bottom:9px;gap:8px}.art-panel{min-height:0}.story-copy{line-height:1.5;min-height:0}.scene-card{padding-top:16px;padding-bottom:16px}h1{margin:7px 0 10px}.lesson{margin-top:10px;padding:10px 13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="masthead">
  <div class="brand">✦ Vijayadashami · The Ramayana ✦</div>
  <button class="music-toggle" id="musicToggle" aria-label="Turn background music on" aria-pressed="false" title="Background music">♫</button>
</header>
<main>
  <div class="story-top"><div class="kicker">A ten-part animated katha</div><div class="counter" id="counter">PART 01 / 10</div></div>
  <div class="progress"><span id="progress"></span></div>
  <section class="stage" aria-live="polite">
    <div class="art-panel" id="artPanel">
      <div class="moon"></div>
      <div class="stars"><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span class="star">✧</span></div>
      <div class="prop one" id="prop1">🪷</div><div class="prop two" id="prop2">✨</div>
      <div class="cast" id="cast"></div>
      <div class="scene-label" id="sceneLabel">Ayodhya · The promise</div>
    </div>
    <article class="scene-card" id="sceneCard">
      <div class="part-label" id="partLabel">Part I · The beginning</div>
      <h1 id="title">The Promise of Ayodhya</h1>
      <div class="story-copy"><span class="typed" id="typed"></span><span class="cursor" id="cursor"></span></div>
      <div class="lesson"><div class="lesson-title">✦ The lesson to carry</div><p id="lesson"></p></div>
    </article>
  </section>
  <div class="controls">
    <button class="navbtn" id="prev" disabled>← Previous</button>
    <div class="dots" id="dots" aria-label="Choose a story part"></div>
    <button class="navbtn primary" id="next">Next part →</button>
  </div>
  <section class="music-drawer" aria-hidden="true">
    <iframe id="musicFrame" title="Background music" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1"></iframe>
  </section>
</main>
<footer>॥ श्री राम जय राम जय जय राम ॥ · Each scene animation loops gently; use Previous and Next to move at your own pace.</footer>
</div>
<script>
const scenes=[
{label:"Ayodhya · The promise",part:"Part I · The beginning",title:"The Promise of Ayodhya",cast:["👑","🏹","🪷"],p1:"🪔",p2:"✨",story:"In the radiant kingdom of Ayodhya, Prince Rama is loved for his kindness and sense of duty. When an old royal promise sends him into fourteen years of forest exile, Rama accepts the path without bitterness. Sita chooses to go with him, and Lakshmana follows in loyalty.",lesson:"Keep your word and meet difficult turns with dignity. A noble heart is measured by conduct, not comfort."},
{label:"The forest · A life of simplicity",part:"Part II · The forest years",title:"A Sacred Life in the Forest",cast:["🌳","🏹","🦌"],p1:"🍃",p2:"🦋",story:"Far from palace walls, Rama, Sita, and Lakshmana live among trees, rivers, sages, and forest creatures. They protect those who seek peace and learn to live with less. The forest becomes a place of quiet strength, where kindness matters more than royal riches.",lesson:"Live simply, respect nature, and protect those who are vulnerable. Do good even when no one is watching."},
{label:"The golden deer · A dangerous illusion",part:"Part III · The turning point",title:"The Golden Deer",cast:["🦌","🌿","🏹"],p1:"✨",p2:"🌼",story:"A wondrous golden deer appears near the hermitage. Sita is enchanted, and Rama follows it into the forest. But the deer is Maricha in disguise, and the distraction sets a dangerous plan in motion. What glitters draws the eye away from what truly matters.",lesson:"Not everything that shines is what it seems. Pause, question appearances, and think before acting on desire."},
{label:"The abduction · Jatayu's courage",part:"Part IV · A great sorrow",title:"Sita Is Taken to Lanka",cast:["🕊️","🌺","🌑"],p1:"🪶",p2:"⚡",story:"Ravana, king of Lanka, abducts Sita by deceit. The noble bird Jatayu bravely tries to stop him and is gravely wounded. When Rama returns and finds Sita gone, grief fills his heart—but he turns that grief into a determined search rather than surrendering to despair.",lesson:"Misusing power is never justified. Jatayu reminds us that standing up for another person matters, even when success seems uncertain."},
{label:"Hanuman · Devotion in action",part:"Part V · Hope awakens",title:"Hanuman Meets Rama",cast:["🙏","🏹","🌄"],p1:"🌸",p2:"✨",story:"Rama and Lakshmana meet Hanuman, whose wisdom, humility, and devotion become essential to their search. Hanuman helps form an alliance with Sugriva. Across distance and sorrow, trust grows—and the rescue of Sita becomes a shared mission.",lesson:"Devotion is action guided by love. Offer your strengths in service of what is right, and let humility make teamwork possible."},
{label:"Across the ocean · A leap of faith",part:"Part VI · Courage in action",title:"Hanuman Crosses the Ocean",cast:["🐒","🌊","🏝️"],p1:"🌬️",p2:"🪷",story:"With faith in Rama and clarity of purpose, Hanuman leaps across the ocean to Lanka. After searching carefully, he finds Sita in the Ashoka grove and gives her Rama’s ring as a sign of hope. His strength is extraordinary, but so are his patience and restraint.",lesson:"Courage is more than fearlessness. Remember why you act, stay clear-minded under pressure, and bring hope to others."},
{label:"Lanka · Truth without fear",part:"Part VII · A warning to pride",title:"Hanuman in Ravana's Court",cast:["🐒","👑","🔥"],p1:"⚔️",p2:"🔥",story:"Hanuman urges Ravana to return Sita and choose peace, but Ravana refuses. Hanuman is captured and his tail is set alight; he escapes, and flames spread through parts of Lanka. Ravana's pride hardens his choices, while Hanuman remains devoted to his mission.",lesson:"Speak truth with courage, and listen before pride closes your ears. Strength without wisdom can destroy."},
{label:"The bridge · Many hands, one purpose",part:"Part VIII · Unity makes a path",title:"The Bridge to Lanka",cast:["🐒","🌉","🏹"],p1:"🪨",p2:"🌊",story:"At the shore, Rama's allies work together to build a bridge across the sea. Each member contributes to the effort, and the impossible distance becomes a path. Their shared purpose turns courage into practical action.",lesson:"Great tasks are rarely achieved alone. Respect every contribution, combine your strengths, and build the path together."},
{label:"The final battle · Dharma stands firm",part:"Part IX · The decisive struggle",title:"Rama Faces Ravana",cast:["🏹","⚔️","👑"],p1:"🔥",p2:"✨",story:"A fierce battle unfolds between Rama's allies and Ravana's forces. At last, Rama faces the mighty king of Lanka. In the familiar telling, Rama's arrow brings Ravana down—not to glorify hatred, but to end a reign sustained by arrogance and injustice.",lesson:"Resist wrongdoing without becoming ruled by hatred. Victory means protecting people, restoring justice, and ending the struggle responsibly."},
{label:"Vijayadashami · The light returns",part:"Part X · The triumph of dharma",title:"The Victory of Good over Evil",cast:["🪔","🏹","🌅"],p1:"🌼",p2:"✨",story:"With Ravana defeated, Sita is reunited with Rama, and the long journey moves toward its close. On Dussehra, communities remember this victory through prayer, performance, and the burning of Ravana's effigy. The story invites each of us to turn inward and face our own flaws.",lesson:"Conquer the Ravana within: anger, greed, cruelty, arrogance, and injustice. Choose truth, compassion, courage, and responsibility—again and again."}
];
let index=0,typingTimer=null;
const $=id=>document.getElementById(id);
function typeText(text){
 clearInterval(typingTimer);$("typed").textContent="";$("cursor").style.display="inline-block";
 let i=0;const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 if(reduced){$("typed").textContent=text;$("cursor").style.display="none";return}
 typingTimer=setInterval(()=>{i+=2;$("typed").textContent=text.slice(0,i);if(i>=text.length){clearInterval(typingTimer);typingTimer=null;$("cursor").style.display="none"}},17);
}
function render(){
 const s=scenes[index];
 $("counter").textContent=`PART ${String(index+1).padStart(2,"0")} / 10`;
 $("progress").style.width=((index+1)*10)+"%";
 $("partLabel").textContent=s.part;$("title").textContent=s.title;$("lesson").textContent=s.lesson;
 $("sceneLabel").textContent=s.label;$("prop1").textContent=s.p1;$("prop2").textContent=s.p2;
 $("cast").innerHTML=s.cast.map((c,i)=>`<span class="character ${i===1?"":"small"}" aria-hidden="true">${c}</span>`).join("");
 $("prev").disabled=index===0;$("next").disabled=index===scenes.length-1;
 $("next").textContent=index===scenes.length-1?"End of tale ✓":"Next part →";
 $("dots").querySelectorAll("button").forEach((b,i)=>{b.classList.toggle("active",i===index);b.setAttribute("aria-current",i===index?"step":"false")});
 $("artPanel").classList.remove("reveal");$("sceneCard").classList.remove("reveal");void $("artPanel").offsetWidth;
 $("artPanel").classList.add("reveal");$("sceneCard").classList.add("reveal");
 typeText(s.story);
}
scenes.forEach((s,i)=>{const b=document.createElement("button");b.className="dot";b.type="button";b.title=`Go to part ${i+1}: ${s.title}`;b.setAttribute("aria-label",b.title);b.addEventListener("click",()=>{index=i;render()});$("dots").appendChild(b)});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
$("next").addEventListener("click",()=>{if(index<scenes.length-1){index++;render()}});
const videoId="leVoi6kkp3o";
let musicPlaying=false;
function setMusic(){
 // YouTube looping requires playlist to match the video ID.
 $("musicFrame").src=`https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=0&loop=1&playlist=${videoId}&rel=0&modestbranding=1&playsinline=1`;
}
$("musicToggle").addEventListener("click",()=>{
 musicPlaying=!musicPlaying;
 if(musicPlaying){setMusic();}
 else{$("musicFrame").src="";}
 $("musicToggle").setAttribute("aria-pressed",String(musicPlaying));
 $("musicToggle").setAttribute("aria-label",musicPlaying?"Turn background music off":"Turn background music on");
 $("musicToggle").title=musicPlaying?"Turn background music off":"Turn background music on";
});
render();
</script>
</body>
</html>
